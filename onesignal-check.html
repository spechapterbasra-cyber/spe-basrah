<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SPE Basrah OneSignal Check</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;padding:24px;line-height:1.55;max-width:760px;margin:auto}
    pre{white-space:pre-wrap;background:#f4f4f4;padding:16px;border-radius:12px}
    button{font:inherit;padding:12px 18px;border-radius:10px;border:0;background:#0759B8;color:white}
  </style>
</head>
<body>
<h2>SPE Basrah — OneSignal Check</h2>
<pre id="out">Loading...</pre>
<button id="fix" hidden>Register this device in OneSignal</button>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {
  const out = document.getElementById('out');
  const fix = document.getElementById('fix');
  const render = async () => {
    const sw = await navigator.serviceWorker.getRegistration('/spe-basrah/onesignal/');
    out.textContent =
      'Origin: ' + location.origin + '\n' +
      'Path: ' + location.pathname + '\n' +
      'Standalone: ' + (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) + '\n' +
      'Notification permission: ' + Notification.permission + '\n' +
      'OneSignal permission: ' + OneSignal.Notifications.permission + '\n' +
      'Opted in: ' + (OneSignal.User.PushSubscription.optedIn === true) + '\n' +
      'Subscription ID: ' + (OneSignal.User.PushSubscription.id || '(not subscribed)') + '\n' +
      'OneSignal SW: ' + (sw ? sw.scope : '(not registered)');
    fix.hidden = OneSignal.User.PushSubscription.optedIn === true;
  };
  try {
    await OneSignal.init({
      appId: '2f9adc4c-b4f7-4a1a-9fac-9c5aeb7f5caf',
      serviceWorkerPath: 'spe-basrah/onesignal/OneSignalSDKWorker.js',
      serviceWorkerParam: { scope: '/spe-basrah/onesignal/' },
      notifyButton: { enable: false }
    });
    await render();
    fix.onclick = async () => {
      fix.disabled = true;
      try {
        if (OneSignal.Notifications.permission !== true) {
          await OneSignal.Notifications.requestPermission();
        }
        if (OneSignal.Notifications.permission === true) {
          await OneSignal.User.PushSubscription.optIn();
        }
      } catch (e) {
        out.textContent += '\n\nERROR: ' + String(e);
      }
      await render();
      fix.disabled = false;
    };
  } catch (e) {
    out.textContent = 'INIT ERROR\n' + String(e);
  }
});
</script>
</body>
</html>
