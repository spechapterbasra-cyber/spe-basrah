<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

  <base href="/spe-basrah/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SPE Basrah Student Chapter academic and engineering platform.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SPE Basrah">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=5">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=5"/>

  <title>SPE Basrah</title>
  <link rel="manifest" href="manifest.json?v=5">
  <script>
    // Academic cache invalidation queue written by the FCM service worker.
    const SPE_CACHE_SIGNAL_DB = "spe_basrah_cache_signal_v1";
    const SPE_CACHE_SIGNAL_STORE = "signals";

    function speBasrahOpenCacheSignalDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(SPE_CACHE_SIGNAL_DB, 1);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(SPE_CACHE_SIGNAL_STORE)) {
            db.createObjectStore(SPE_CACHE_SIGNAL_STORE, { keyPath: "id" });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function speBasrahStoreAcademicInvalidation(data) {
      if (!data) return false;
      const academicStage = String(data.academicStage || data.academic_stage || data.stage || "").trim();
      const academicCourse = String(data.academicCourse || data.academic_course || data.course || "").trim();
      const subject = String(data.subject || data.academicSubject || "").trim();
      const category = String(data.category || data.academicCategory || "").trim();
      const action = String(data.cache_action || data.cacheAction || "academic_invalidate").toLowerCase();
      if (!academicStage || !academicCourse) return false;
      if (action !== "subject_info_invalidate" && (!subject || !category)) return false;
      try {
        const db = await speBasrahOpenCacheSignalDb();
        const item = {
          id: `${action}|${academicStage}|${academicCourse}|${subject}|${category}|${Date.now()}|${Math.random()}`,
          cache_action: action,
          academicStage,
          academicCourse,
          ...(subject ? { subject } : {}),
          ...(category ? { category } : {}),
          ...(data.publishedAtMs ? { publishedAtMs: String(data.publishedAtMs) } : {}),
          createdAt: Date.now(),
        };
        await new Promise((resolve, reject) => {
          const tx = db.transaction(SPE_CACHE_SIGNAL_STORE, "readwrite");
          tx.objectStore(SPE_CACHE_SIGNAL_STORE).put(item);
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
        db.close();
        return true;
      } catch (error) {
        console.warn("[SPE Basrah] Failed to store academic invalidation", error);
        return false;
      }
    }

    window.speBasrahDrainAcademicInvalidations = async function() {
      try {
        const db = await speBasrahOpenCacheSignalDb();
        const items = await new Promise((resolve, reject) => {
          const tx = db.transaction(SPE_CACHE_SIGNAL_STORE, "readwrite");
          const store = tx.objectStore(SPE_CACHE_SIGNAL_STORE);
          const request = store.getAll();
          request.onsuccess = () => {
            const rows = Array.isArray(request.result) ? request.result : [];
            store.clear();
            resolve(rows);
          };
          request.onerror = () => reject(request.error);
        });
        db.close();
        return JSON.stringify(items);
      } catch (error) {
        console.warn("[SPE Basrah] Failed to drain academic invalidations", error);
        return "[]";
      }
    };

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.addEventListener("message", async (event) => {
        if (event?.data?.type === "SPE_ACADEMIC_INVALIDATE") {
          await speBasrahStoreAcademicInvalidation(event.data.data || {});
        }
      });
    }

    // ------------------------------------------------------------------
    // Local notification inbox (IndexedDB). This intentionally avoids
    // reading app_notifications from Firestore on every device.
    // ------------------------------------------------------------------
    const SPE_INBOX_DB = "spe_basrah_local_inbox_v1";
    const SPE_INBOX_STORE = "notifications";

    function speBasrahOpenInboxDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(SPE_INBOX_DB, 1);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(SPE_INBOX_STORE)) {
            db.createObjectStore(SPE_INBOX_STORE, { keyPath: "id" });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function speBasrahNotificationFromObject(input) {
      const notification = input?.notification || input || {};
      const additional =
        notification.additionalData ||
        notification.data ||
        input?.additionalData ||
        input?.data ||
        {};

      const route =
        String(additional.route || notification.route || "").trim();

      return {
        id: String(
          additional.inboxId ||
          additional.notificationId ||
          notification.notificationId ||
          notification.id ||
          `${Date.now()}-${Math.random()}`
        ),
        title: String(
          notification.title ||
          additional.title ||
          "SPE Basrah"
        ),
        body: String(
          notification.body ||
          additional.body ||
          ""
        ),
        route,
        academicStage: String(additional.academicStage || "").trim(),
        academicCourse: String(additional.academicCourse || "").trim(),
        subject: String(additional.subject || "").trim(),
        category: String(additional.category || "").trim(),
        contentType: String(additional.contentType || "").trim(),
        createdAt: Date.parse(additional.sentAt || "") || Date.now(),
      };
    }

    async function speBasrahStoreLocalNotification(input) {
      try {
        const item = speBasrahNotificationFromObject(input);
        if (!item.body.trim() || Date.now() - item.createdAt >= 48 * 60 * 60 * 1000) return false;
        const db = await speBasrahOpenInboxDb();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(SPE_INBOX_STORE, "readwrite");
          tx.objectStore(SPE_INBOX_STORE).put(item);
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
        db.close();
        window.dispatchEvent(new CustomEvent("spe-basrah-local-inbox-changed"));
        return true;
      } catch (error) {
        console.warn("[SPE Basrah] Failed to store local notification", error);
        return false;
      }
    }

    window.speBasrahDrainLocalNotifications = async function() {
      try {
        const db = await speBasrahOpenInboxDb();
        const items = await new Promise((resolve, reject) => {
          const tx = db.transaction(SPE_INBOX_STORE, "readwrite");
          const store = tx.objectStore(SPE_INBOX_STORE);
          const request = store.getAll();
          request.onsuccess = () => {
            const rows = Array.isArray(request.result) ? request.result : [];
            store.clear();
            resolve(rows);
          };
          request.onerror = () => reject(request.error);
        });
        db.close();

        items.sort((a, b) => Number(b.createdAt || 0) - Number(a.createdAt || 0));
        return JSON.stringify(items);
      } catch (error) {
        console.warn("[SPE Basrah] Failed to drain local notification inbox", error);
        return "[]";
      }
    };

    // Favourites kept on this device (Cache Storage), so Favorites opens the
    // saved file without the internet. Keys are same-origin fake paths.
    const SPE_FAV_CACHE = "spe-favorite-files-v1";
    function speFavKey(id) {
      return new URL("__spe_favorite__/" + encodeURIComponent(id), document.baseURI).toString();
    }
    async function speFavMatch(id) {
      if (!("caches" in window)) return null;
      const cache = await caches.open(SPE_FAV_CACHE);
      return (await cache.match(speFavKey(id))) || null;
    }
    window.speBasrahFavSave = async function (id, url) {
      try {
        if (!("caches" in window)) return false;
        const response = await fetch(url, { mode: "cors", redirect: "follow" });
        if (!response.ok) return false;
        const type = (response.headers.get("content-type") || "").toLowerCase();
        if (type.includes("text/html")) return false; // a login/error page
        const blob = await response.blob();
        if (!blob.size) return false;
        const cache = await caches.open(SPE_FAV_CACHE);
        await cache.put(speFavKey(id), new Response(blob, {
          headers: { "content-type": type || "application/octet-stream" },
        }));
        // Ask the browser not to clear saved favourites under storage pressure.
        if (navigator.storage && navigator.storage.persist) {
          navigator.storage.persist().catch(() => {});
        }
        return true;
      } catch (error) {
        console.warn("[SPE Basrah] Could not save favourite offline", error);
        return false;
      }
    };
    window.speBasrahFavHas = async function (id) {
      try { return !!(await speFavMatch(id)); } catch (_) { return false; }
    };
    window.speBasrahFavRead = async function (id) {
      try {
        const response = await speFavMatch(id);
        return response ? new Uint8Array(await response.arrayBuffer()) : null;
      } catch (_) {
        return null;
      }
    };
    window.speBasrahFavDelete = async function (id) {
      try {
        if (!("caches" in window)) return;
        const cache = await caches.open(SPE_FAV_CACHE);
        await cache.delete(speFavKey(id));
      } catch (_) {}
    };
    // Must be called inside the tap: the tab is opened immediately, then the
    // saved file is shown in it.
    window.speBasrahFavOpen = function (id) {
      const tab = window.open("", "_blank");
      speFavMatch(id).then(async (response) => {
        if (!response || !tab) { if (tab) tab.close(); return; }
        const url = URL.createObjectURL(await response.blob());
        tab.location.href = url;
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      }).catch(() => { if (tab) tab.close(); });
    };

    // iPhone: let the app reach the bottom edge (under the home indicator)
    // like the native app, so the floating tab bar can sit as low as
    // Telegram's. Flutter replaces the viewport tag at start-up, so re-add
    // viewport-fit=cover whenever it does. Flutter web does not know the
    // safe-area size, so the app reads it from speBasrahSafeAreaBottom().
    (function () {
      const isIos = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      if (!isIos) return;

      function addViewportFit() {
        document.querySelectorAll('meta[name="viewport"]').forEach((meta) => {
          if (!/viewport-fit/.test(meta.content)) {
            meta.content = meta.content + ", viewport-fit=cover";
          }
        });
      }
      addViewportFit();
      new MutationObserver(addViewportFit).observe(document.head, { childList: true });

      let probe = null;
      window.speBasrahSafeAreaBottom = function () {
        if (!document.body) return 0;
        if (!probe) {
          probe = document.createElement("div");
          probe.style.cssText = "position:fixed;left:0;bottom:0;width:0;" +
            "height:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none;";
          document.body.appendChild(probe);
        }
        return probe.getBoundingClientRect().height || 0;
      };
    })();
  </script>
  <script src="fcm-push.js" defer></script>
</head>
<body>
  <!-- Shown at once while the app downloads (the first visit can take several
       seconds), in the colours of the app's own launch screen, which takes
       over seamlessly when Flutter draws its first frame. -->
  <style>
    #spe-loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 35%, #16408F 0%, #0C2460 55%, #081A4A 100%);
      color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      transition: opacity .35s ease;
    }
    #spe-loader.spe-hide { opacity: 0; pointer-events: none; }
    #spe-loader img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    #spe-loader .spe-name { margin-top: 18px; font-size: 24px; font-weight: 800; letter-spacing: .3px; }
    #spe-loader .spe-sub { margin-top: 6px; font-size: 13px; opacity: .8; }
    #spe-loader .spe-bar { margin-top: 28px; width: 160px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
    #spe-loader .spe-bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: #fff; animation: spe-slide 1.1s ease-in-out infinite; }
    #spe-loader .spe-wait { margin-top: 16px; font-size: 12px; opacity: 0; transition: opacity .4s ease; text-align: center; padding: 0 24px; }
    #spe-loader .spe-wait.spe-show { opacity: .75; }
    @keyframes spe-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
  </style>
  <div id="spe-loader" aria-label="SPE Basrah">
    <img src="icons/Icon-192.png?v=5" alt="">
    <div class="spe-name">SPE Basrah</div>
    <div class="spe-sub" id="spe-loader-sub">الفرع الطلابي في جامعة البصرة</div>
    <div class="spe-bar"><i></i></div>
    <div class="spe-wait" id="spe-loader-wait">أول فتح ياخذ وقت أطول شوية، بعدها يفتح بسرعة…</div>
  </div>
  <script>
    (function () {
      var loader = document.getElementById('spe-loader');
      // The app's saved language (shared_preferences), else Arabic as in the app.
      var english = (function () {
        try { return (localStorage.getItem('flutter.app_language') || '').indexOf('en') >= 0; } catch (_) { return false; }
      })();
      if (english) {
        document.getElementById('spe-loader-sub').textContent = 'University of Basrah Student Chapter';
        document.getElementById('spe-loader-wait').textContent = 'The first visit takes a little longer; after that it opens quickly…';
      }
      var hint = setTimeout(function () {
        var wait = document.getElementById('spe-loader-wait');
        if (wait) wait.className = 'spe-wait spe-show';
      }, 6000);
      function done() {
        clearTimeout(hint);
        if (!loader) return;
        loader.className = 'spe-hide';
        setTimeout(function () { if (loader && loader.parentNode) loader.parentNode.removeChild(loader); loader = null; }, 400);
      }
      window.addEventListener('flutter-first-frame', done, { once: true });
      // Safety net: never cover the app if the event is missed.
      setTimeout(done, 60000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->


  <!-- Load the newest build: read version.txt past the browser cache, then
       load flutter_bootstrap.js (and main.dart.js) under that version. -->
  <script>
    (function () {
      function start(version) {
        window.speBuildVersion = version;
        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js' + (version ? '?v=' + encodeURIComponent(version) : '');
        script.async = true;
        document.body.appendChild(script);
      }
      fetch('version.txt', { cache: 'no-store' })
        .then(function (response) { return response.ok ? response.text() : ''; })
        .then(function (text) { start(text.trim()); }, function () { start(''); });
    })();
  </script>
</body>
</html>
